name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Переводы, якоря, безопасность, вес
        run: node scripts/check.js

  deploy:
    name: Публикация
    needs: check
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Инструменты сборки
        run: npm ci --omit=optional

      # Библиотеки анимации переезжают к нам: после этого шага на
      # странице не останется скриптов с чужих доменов, а в CSP —
      # script-src 'self'. Не скачалось — шаг падает, и наружу
      # остаётся прошлая рабочая версия сайта.
      - name: Забрать gsap и lenis к себе
        run: node scripts/vendor.js

      # В dist/ едет сжатая копия: без комментариев, без макетов для
      # инстаграма и без самих скриптов сборки.
      - name: Сборка
        run: node scripts/build.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
