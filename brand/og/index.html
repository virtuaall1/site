<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>v.studio — картка для соцмереж</title>
<!--
  Картинка, которую показывают телеграм, фейсбук и поиск, когда
  кто-то кидает ссылку на сайт. 1200×630 — размер, который все они
  понимают без обрезки.

  Оформление не выдумано: та же бумага по чернилам, тот же кислотный
  акцент и та же сетка точек с шагом 34px, что на самом сайте.
-->
<style>
  :root {
    --ink: #0a0a0b;
    --paper: #f2efe8;
    --muted: #8d8d94;
    --acid: #d8ff3e;
    --rule: rgba(242, 239, 232, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 64px 72px;
    background: var(--ink);
    color: var(--paper);
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* сетка точек — как фон сайта, только не двигается */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(242, 239, 232, 0.16) 1px, transparent 1px);
    background-size: 34px 34px;
  }
  /* к правому краю сетка гаснет, чтобы не спорить с текстом */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, var(--ink) 34%, rgba(10, 10, 11, 0.72) 62%, rgba(10, 10, 11, 0.1));
  }
  body > * { position: relative; z-index: 1; }

  .top { display: flex; align-items: center; justify-content: space-between; }

  .brand { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
  /* точка в имени — квадрат: так она выглядит в Unbounded на сайте */
  .brand i {
    display: inline-block;
    width: 9px; height: 9px;
    margin: 0 3px 2px;
    background: var(--acid);
    font-style: normal;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    padding: 9px 18px;
    border: 1px solid var(--rule);
    font-size: 17px;
    color: var(--muted);
  }
  .status b { width: 8px; height: 8px; background: var(--acid); }

  h1 {
    max-width: 15ch;
    font-size: 82px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.045em;
  }
  h1 em { font-style: normal; color: var(--acid); }

  .foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 40px;
    padding-top: 30px;
    border-top: 1px solid var(--rule);
  }
  .facts { display: flex; gap: 36px; font-size: 19px; color: var(--muted); }
  .facts span { display: flex; align-items: center; gap: 10px; }
  .facts span::before { content: ''; width: 18px; height: 1px; background: currentColor; }

  .site { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
</style>
</head>
<body>

<div class="top">
  <span class="brand">v<i></i>studio</span>
  <span class="status"><b></b>беремо проєкти</span>
</div>

<h1>Сайти, сервіси і боти, які <em>працюють за вас</em></h1>

<div class="foot">
  <div class="facts">
    <span>Вихідники твої</span>
    <span>Фіксована ціна</span>
    <span>Місяць підтримки</span>
  </div>
  <span class="site">vstudio.dev</span>
</div>

</body>
</html>
