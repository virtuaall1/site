<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>og — v.studio</title>

<!-- Те же шрифты, что на сайте. Берём не копию, а тот же
     css/fonts.css: карточка не должна разъехаться с сайтом, когда
     шрифты поменяются. -->
<link rel="stylesheet" href="/css/fonts.css">

<style>
  /* Карточка для соцсетей — 1200×630, ровно и без масштабирования:
     телеграм и фейсбук режут всё, что не в этих пропорциях.

     Оформление то же, что на сайте: чёрное стекло. Человек видит
     эту картинку раньше самого сайта, и она обязана обещать
     именно то, что он потом откроет. */
  :root {
    --void: #08080a;
    --paper: #f2efe8;
    --muted: #8f8f97;
    --faint: #5c5c64;
    --acid: #d8ff3e;
    --rule: rgba(255, 255, 255, 0.08);
    --rule-soft: rgba(255, 255, 255, 0.045);
    --glass: rgba(255, 255, 255, 0.035);
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: var(--void);
    color: var(--paper);
    font-family: 'Onest', system-ui, sans-serif;
  }

  /* Фоновая сетка точек — тот же шаг 34px, что рисует канвас на
     сайте. Здесь она статична: это картинка, а не страница. */
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(242, 239, 232, 0.13) 1px, transparent 1px);
    background-size: 34px 34px;
  }

  /* Свет сверху слева: он и создаёт ту самую глубину, ради
     которой всё затевалось. */
  .glow {
    position: absolute;
    left: -180px;
    top: -260px;
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(216, 255, 62, 0.07), transparent 62%);
  }

  .frame {
    position: relative;
    height: 100%;
    padding: 66px 72px;
    display: flex;
    flex-direction: column;
  }

  .top { display: flex; align-items: center; justify-content: space-between; }

  .brand {
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.03em;
  }
  /* Точка в имени — квадрат, как в знаке на сайте */
  .brand i {
    width: 0.26em;
    height: 0.26em;
    background: var(--acid);
    font-style: normal;
    color: transparent;
    overflow: hidden;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 9px 14px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--rule-soft);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
    font-size: 17px;
    color: var(--muted);
  }
  .status b { width: 8px; height: 8px; border-radius: 50%; background: var(--acid); }

  h1 {
    margin-top: auto;
    max-width: 17ch;
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: 76px;
    line-height: 0.96;
    letter-spacing: -0.055em;
  }
  h1 em { font-style: normal; color: var(--acid); }

  .foot {
    margin-top: 44px;
    padding-top: 26px;
    border-top: 1px solid var(--rule-soft);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .facts { display: flex; gap: 36px; font-size: 19px; color: var(--faint); }
  .facts span { display: inline-flex; align-items: center; gap: 10px; }
  .facts span::before { content: ''; width: 16px; height: 1px; background: currentColor; }

  .site {
    font-family: 'Unbounded', sans-serif;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body>
<div class="dots"></div>
<div class="glow"></div>

<div class="frame">
  <div class="top">
    <span class="brand">v<i>.</i>studio</span>
    <span class="status"><b></b>беремо проєкти</span>
  </div>

  <h1>Сайти, сервіси і боти, які <em>працюють за вас</em></h1>

  <div class="foot">
    <div class="facts">
      <span>Вихідники твої</span>
      <span>Фіксована ціна</span>
      <span>Місяць підтримки</span>
    </div>
    <span class="site">vrtll.dev</span>
  </div>
</div>
</body>
</html>
